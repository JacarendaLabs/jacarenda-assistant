# Public-facing gateway: the only service that accepts internet traffic.
# Proxies validated requests to vellum-assistant.internal:3001.
#
# Deploy from repo root:
#   flyctl deploy --config deploy/fly/gateway.toml --remote-only

app = "vellum-gateway"
primary_region = "lhr"

# Dockerfile is passed via --dockerfile flag at deploy time (relative to repo root):
#   flyctl deploy --config deploy/fly/gateway.toml --dockerfile gateway/Dockerfile --remote-only
[build]

[env]
  GATEWAY_PORT = "7830"
  ASSISTANT_HOST = "vellum-assistant.internal"
  RUNTIME_HTTP_PORT = "3001"
  RUNTIME_PROXY_ENABLED = "true"
  RUNTIME_PROXY_REQUIRE_AUTH = "true"
  GATEWAY_SECURITY_DIR = "/security"
  NODE_ENV = "production"

[[mounts]]
  source = "vellum_gateway_security"
  destination = "/security"

[http_service]
  internal_port = 7830
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# TCP check — the gateway's /v1/health requires edge auth, so we use a
# port-open check instead. Sufficient for Fly's routing decisions.
[[services]]
  internal_port = 7830
  protocol = "tcp"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
