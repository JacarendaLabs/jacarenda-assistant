# Combined Vellum deployment: assistant daemon + gateway in one Fly machine.
# Replaces the separate vellum-gateway / vellum-assistant / vellum-ces apps.
#
# Deploy from repo root:
#   flyctl deploy --config deploy/fly/combined.toml \
#                 --dockerfile deploy/Dockerfile.combined \
#                 --remote-only

app = "vellum-gateway"
primary_region = "lhr"

[build]

[env]
  # Volume mount point — see [[mounts]] below.
  DATA_ROOT = "/data"

  # Assistant daemon
  RUNTIME_HTTP_PORT = "3001"
  RUNTIME_HTTP_HOST = "127.0.0.1"
  VELLUM_WORKSPACE_DIR = "/root/.vellum/workspace"
  IS_CONTAINERIZED = "true"

  # Gateway
  GATEWAY_PORT = "7830"
  ASSISTANT_HOST = "127.0.0.1"
  RUNTIME_PROXY_ENABLED = "true"
  RUNTIME_PROXY_REQUIRE_AUTH = "true"
  GATEWAY_SECURITY_DIR = "/root/.vellum/protected"

  # Credential Executor Service (managed sidecar)
  CES_MODE = "managed"
  CES_HEALTH_PORT = "8090"
  CES_DATA_ROOT = "/data/vellum/ces-data"
  CES_BOOTSTRAP_SOCKET_DIR = "/run/ces-bootstrap"
  CREDENTIAL_SECURITY_DIR = "/root/.vellum/protected"

  NODE_ENV = "production"

[[mounts]]
  source = "vellum_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 7830
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# TCP check — gateway's /v1/health requires edge auth, so use a port-open
# check instead. Sufficient for Fly's routing decisions.
[[services]]
  internal_port = 7830
  protocol = "tcp"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
