# Assistant runtime daemon: the brain. Never exposed to the internet.
# Reachable only as vellum-assistant.internal:3001 from other Fly apps in the org.
#
# Deploy from repo root:
#   flyctl deploy --config deploy/fly/assistant.toml --remote-only

app = "vellum-assistant"
primary_region = "lhr"

# Dockerfile is passed via --dockerfile flag at deploy time (relative to repo root):
#   flyctl deploy --config deploy/fly/assistant.toml --dockerfile assistant/Dockerfile --remote-only
[build]

[env]
  RUNTIME_HTTP_PORT = "3001"
  RUNTIME_HTTP_HOST = "0.0.0.0"
  IS_CONTAINERIZED = "true"
  VELLUM_WORKSPACE_DIR = "/workspace"
  NODE_ENV = "production"

[[mounts]]
  source = "vellum_workspace"
  destination = "/workspace"
  initial_size = "10gb"

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
